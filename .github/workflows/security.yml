name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 08:00 UTC catches new advisories on a stable branch
    # even if no PRs land that week.
    - cron: '0 8 * * 1'

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  socket:
    name: Socket.dev supply-chain scan
    runs-on: ubuntu-latest
    # Hoist the secret to the job env so step-level `if: env.X != ''`
    # actually sees it. (`env:` defined inside a single step isn't visible
    # to that step's own `if:` — GitHub evaluates `if` before binding env.)
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Run Socket scan
        if: env.SOCKET_SECURITY_API_KEY != ''
        uses: SocketDev/socket-security-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip notice
        if: env.SOCKET_SECURITY_API_KEY == ''
        run: echo "::notice::SOCKET_SECURITY_API_KEY not configured — skipping Socket.dev scan"

  snyk:
    name: Snyk vulnerability scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Snyk test
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        continue-on-error: true # report-only, don't block PRs
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif
      - name: Upload Snyk SARIF to GitHub Security
        if: env.SNYK_TOKEN != '' && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
      - name: Skip notice
        if: env.SNYK_TOKEN == ''
        run: echo "::notice::SNYK_TOKEN not configured — skipping Snyk scan"

  npm-audit:
    name: npm audit (always-on baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      # bun audit was added in 1.2; warn-only so PRs don't gate on it.
      - name: bun audit (high)
        run: bun audit --audit-level=high || echo "::warning::bun audit reported issues"

  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
