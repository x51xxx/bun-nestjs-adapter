name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  test:
    name: Test (own integration suite, Bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      # Both versions always report: a failure on one is the signal, and
      # cancelling the other hides whether it is version-specific.
      fail-fast: false
      matrix:
        # 1.4.0 is the baseline this adapter is developed against; 1.4.3 is the
        # current release. Both are pinned on purpose — a floating `latest`
        # turns an upstream regression into a red build on an unrelated PR.
        # Verified locally before adding: the suite passes identically on both.
        bun: ['1.4.0', '1.4.3']
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - name: Run integration suite with coverage
        run: bun test --preload ./tests/preload.ts --coverage --coverage-reporter=lcov --coverage-dir=coverage tests/integration/
      - name: Upload coverage to Codecov
        # One upload only. The matrix runs the same suite against two runtimes,
        # so the second report adds no covered lines — just a duplicate upload
        # for Codecov to reconcile.
        uses: codecov/codecov-action@v6
        if: always() && matrix.bun == '1.4.0'
        with:
          files: coverage/lcov.info
          flags: integration
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-upstream-fixtures:
    name: Compatibility (nestjs/nest fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - name: Build nestjs/nest fixtures
        run: bash scripts/fixtures-install.sh
      - run: bun run test:fixtures

  bench-smoke:
    name: Bench smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run bench:quick
