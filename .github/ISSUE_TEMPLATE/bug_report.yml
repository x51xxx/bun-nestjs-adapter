name: 🐛 Bug report
description: Something is broken or behaves unexpectedly
title: '[bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill out the sections
        below — minimal reproductions get fixed dramatically faster.

  - type: input
    id: bun-version
    attributes:
      label: Bun version
      description: '`bun --version`'
      placeholder: 1.4.0
    validations:
      required: true

  - type: input
    id: nest-version
    attributes:
      label: '@nestjs/core version'
      placeholder: 11.1.10
    validations:
      required: true

  - type: input
    id: adapter-version
    attributes:
      label: '@taras/platform-bun version'
      placeholder: 0.1.0
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        Either a code snippet pasted inline (use ```ts fences) or a link to a
        StackBlitz / GitHub repo. *Without* a reproduction we can't act.
      render: ts
    validations:
      required: true

  - type: textarea
    id: stack
    attributes:
      label: Stack trace / error output
      render: shell
    validations:
      required: false

  - type: dropdown
    id: feature-area
    attributes:
      label: Affected area
      multiple: true
      options:
        - HTTP routing
        - WebSocket gateway
        - SSE / streaming
        - File uploads
        - Versioning
        - CORS / static assets
        - Build / typings
        - Performance
        - Other
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I'm running on a supported runtime (Bun ≥ 1.3)
          required: true
